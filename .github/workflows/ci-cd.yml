name: CI/CD Pipeline

on:
  push:
    branches: [ main, pre-production, production ]
  pull_request:
    branches: [ main, pre-production, production ]

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run frontend linter
        run: npm run lint

      - name: Run frontend tests with coverage
        run: npx nx test frontend --coverage --watch=false

      - name: Build frontend application
        run: npx nx build frontend --configuration=production

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: coverage/apps/frontend
          retention-days: 30

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/apps/frontend
          retention-days: 30

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bookify_test
          POSTGRES_PASSWORD: bookify_test
          POSTGRES_DB: bookify_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://bookify_test:bookify_test@localhost:5432/bookify_test?schema=public
        run: |
          npx prisma generate --schema=apps/backend/prisma/schema.prisma
          npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma

      - name: Run backend linter
        run: npm run backend:lint

      - name: Run backend tests with coverage
        env:
          DATABASE_URL: postgresql://bookify_test:bookify_test@localhost:5432/bookify_test?schema=public
          JWT_SECRET: test-secret-key
        run: npx nx test backend --coverage --watch=false

      - name: Build backend application
        run: npx nx build backend --configuration=production

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage/apps/backend
          retention-days: 30

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: dist/apps/backend
          retention-days: 30

  app-build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, quality-gate-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (production)
        run: npx nx build frontend --configuration=production

      - name: Build backend (production)
        run: npx nx build backend --configuration=production

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-production
          path: dist/apps/frontend
          retention-days: 30

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-production
          path: dist/apps/backend
          retention-days: 30

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    if: always()
    
    steps:
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: ./coverage/frontend

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: ./coverage/backend

      - name: Display test summary
        run: |
          echo "✅ CI/CD Pipeline completed"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📊 Coverage reports available in artifacts"
          echo "Frontend coverage: ./coverage/frontend"
          echo "Backend coverage: ./coverage/backend"

  sonarcloud-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: coverage/apps/frontend

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage/apps/backend

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.verbose=true

  quality-gate-check:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: sonarcloud-analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cb3ed20f9fec62b4c3b8ad9e77656c6adaade913 # specific commit for stability
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

      - name: Quality Gate Status
        run: |
          echo "✅ Quality Gate passed!"
          echo "All quality standards have been met."
  docker-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: app-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          echo "image=${{ secrets.DOCKER_USERNAME }}/bookify" >> $GITHUB_OUTPUT
          echo "branch_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "sha_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch_tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  deploy:
    name: Deploy Application
    needs: [docker-image, quality-gate-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'production'
    
    steps:
      - name: Deploy to Hetzner via Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ secrets.DOCKER_USERNAME }}/bookify:${{ github.ref_name }}"
            docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
            docker pull $IMAGE
            docker stop bookify || true
            docker rm bookify || true
            docker run -d --name bookify -p 80:3000 --env-file /opt/bookify/.env $IMAGE
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}