<mat-toolbar color="primary" class="header">
  <button mat-icon-button (click)="onToggleSidenav()" *ngIf="isAuthenticated">
    <mat-icon>menu</mat-icon>
  </button>
  
  <span class="logo" (click)="navigateTo('/events')" style="cursor: pointer;">
    <mat-icon>event</mat-icon>
    Bookify Events
  </span>
  
  <span class="spacer"></span>
  
  <div class="nav-buttons">
    <button mat-button (click)="navigateTo('/events')">
      <mat-icon>event_available</mat-icon>
      Events
    </button>
    
    <ng-container *ngIf="isAuthenticated">
      <button mat-button (click)="navigateTo('/profile/bookings')">
        <mat-icon>confirmation_number</mat-icon>
        My Bookings
      </button>
      
      <button mat-button (click)="navigateTo('/profile/favorites')">
        <mat-icon>favorite</mat-icon>
        Favorites
      </button>
      
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
        <mat-icon>account_circle</mat-icon>
        <span class="user-email">{{ currentUser?.email || 'User' }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      
      <mat-menu #userMenu="matMenu">
        <div class="user-info" mat-menu-item disabled>
          <div class="user-details">
            <strong>{{ currentUser?.username || currentUser?.email }}</strong>
            <small>{{ currentUser?.email }}</small>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="navigateTo('/profile')">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item (click)="navigateTo('/profile/bookings')">
          <mat-icon>confirmation_number</mat-icon>
          <span>My Bookings</span>
        </button>
        <button mat-menu-item (click)="navigateTo('/profile/favorites')">
          <mat-icon>favorite</mat-icon>
          <span>Favorites</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="onLogout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </ng-container>
    
    <ng-container *ngIf="!isAuthenticated">
      <button mat-button (click)="navigateTo('/auth/login')">
        <mat-icon>login</mat-icon>
        Login
      </button>
      <button mat-raised-button color="accent" (click)="navigateTo('/auth/register')">
        Register
      </button>
    </ng-container>
  </div>
</mat-toolbar>
