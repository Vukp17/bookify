# SonarCloud Configuration for Bookify
# Replace <your-sonarcloud-project-key> and <your-sonarcloud-organization> with your actual values

sonar.projectKey=Vukp17_bookify
sonar.organization=vukp17-1
sonar.host.url=https://sonarcloud.io

# Project information
sonar.projectName=Bookify
sonar.projectVersion=1.0

# Source directories
sonar.sources=apps/backend/src,apps/frontend/src
sonar.tests=apps/backend/src,apps/frontend/src
sonar.test.inclusions=**/*.spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**, **/dist/**, **/coverage/**, **/tmp/**, **/*.spec.ts, **/test-setup.ts, **/environments/**
sonar.test.exclusions=**/node_modules/**, **/dist/**, **/coverage/**

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/apps/frontend/lcov.info,coverage/apps/backend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/apps/frontend/lcov.info,coverage/apps/backend/lcov.info

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8
